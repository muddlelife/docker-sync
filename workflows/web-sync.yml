name: Web 镜像同步 v2
run-name: image-sync-${{ inputs.task_id }}
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 控制台任务 ID
        required: true
        type: string
      version:
        description: 任务协议版本
        required: true
        default: "1"
        type: string
      secret_name:
        description: 控制台自动管理的任务密钥标识
        required: true
        type: string
      payload:
        description: 加密任务数据
        required: true
        type: string
permissions:
  contents: read
  packages: read
env:
  SYNC_RUNNER_IMAGE: ghcr.io/muddlelife/docker-sync:runner
concurrency:
  group: image-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检查任务密钥
        env:
          SYNC_PAYLOAD_KEY: ${{ secrets[inputs.secret_name] }}
          TASK_SECRET_NAME: ${{ inputs.secret_name }}
        run: |
          if [[ ! "$TASK_SECRET_NAME" =~ ^DOCKER_SYNC_KEY_[0-9A-F]{24}$ ]]; then
            echo "::error::任务密钥标识无效，请使用控制台发起同步。"
            exit 1
          fi
          if [[ ! "$SYNC_PAYLOAD_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::任务密钥未就绪，请回到控制台的连接设置重新初始化 GitHub 连接。"
            exit 1
          fi
      - name: 登录同步工具镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 拉取已发布的同步工具
        run: docker pull "$SYNC_RUNNER_IMAGE"
      - name: 使用 Skopeo 同步镜像
        run: |
          mkdir -p artifacts
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/artifacts,dst=/artifacts" \
            --env TASK_ID --env TASK_PROTOCOL_VERSION --env TASK_PAYLOAD \
            --env SYNC_PAYLOAD_KEY --env GITHUB_ACTIONS --env GITHUB_RUN_ATTEMPT \
            "$SYNC_RUNNER_IMAGE" execute --output-dir /artifacts
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_PROTOCOL_VERSION: ${{ inputs.version }}
          TASK_PAYLOAD: ${{ inputs.payload }}
          SYNC_PAYLOAD_KEY: ${{ secrets[inputs.secret_name] }}
      - name: 保存逐项结果和脱敏日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-sync-result-${{ github.run_attempt }}
          path: |
            artifacts/result.json
            artifacts/sync.log
          retention-days: 14
          if-no-files-found: warn
